# CI — chặn gộp/push khi code hỏng.
#
# Chạy tự động khi có push/PR vào main:
#   1. backend : go vet + go test (+ race cho package không có goroutine nền)
#   2. web     : npm ci + tsc --noEmit + vite build
#
# Deploy production không làm ở đây: Vercel (web) và Render (backend) tự build
# từ main. Workflow này chỉ là cổng kiểm thử trước khi merge.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# PR mới thì huỷ bỏ lần chạy cũ của cùng một ref cho đỡ tốn thời gian.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          check-latest: true
          cache-dependency-path: server/go.sum

      - name: Download dependencies
        run: go mod download

      - name: go vet
        run: go vet ./...

      # Test tuần tự toàn bộ (khớp đúng bộ đang chạy local).
      - name: go test
        run: go test ./... -count=1

      # Race detector cho các package không bắn goroutine nền.
      # (package `controllers` tạo đơn sẽ chạy nền autoHandoverToGHNAsync +
      #  notifyOrderEmail, chạm config.DB global sau khi test đóng DB -> race
      #  giả tạo của hạ tầng test, không phải lỗi production.)
      - name: go test (race, trừ controllers)
        run: go test ./config/... ./payments/... ./services/... -count=1 -race

      - name: Build binary
        run: go build -o /tmp/boko-server .

  web:
    name: Web (React + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Type check
        working-directory: app
        run: npm run lint

      - name: Build
        working-directory: app
        run: npm run build
