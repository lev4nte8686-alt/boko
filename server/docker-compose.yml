services:
  db:
    image: postgres:16
    container_name: boko-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    expose:
      - "5432"
    volumes:
      - boko-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 3s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - boko-net

  backend:
    build: .
    container_name: boko-backend
    expose:
      - "8080"
    env_file:
      - .env
    environment:
      DB_HOST: db      # override localhost trong .env → dùng service name Docker
      DB_PORT: "5432"
      # Nới rate limit cho bộ test e2e local (nhiều request cùng IP).
      # Production (Render) KHÔNG set → mặc định 120 request/phút/IP.
      RATE_LIMIT_PER_MINUTE: "600"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    networks:
      - boko-net

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: boko-nginx
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - boko-net

# networks:
#   boko-net:
#     external: true

volumes:
  boko-pgdata:
